<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NightLens — Seven-slide judge demo</title><meta name="description" content="Seven slides: actual NightLens app views, NASA evidence, calculated sky and responsible lighting."><style>
@font-face{font-family:DM;src:url('../fonts/dm-sans-latin-400-600-normal.woff2')}*{box-sizing:border-box}body{margin:0;background:#04090e;color:#edf2f4;font-family:DM,Arial,sans-serif}main{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;max-width:1600px;margin:auto;padding:22px 28px;gap:18px}header,footer,nav{display:flex;align-items:center;justify-content:space-between;gap:16px}header strong{font-size:22px;letter-spacing:-.6px}a{color:#d6e3ea;text-underline-offset:5px}header a{font-size:13px}.stage{max-height:calc(100svh - 185px);width:min(100%,calc((100svh - 185px)*16/9));justify-self:center;position:relative;align-self:center;aspect-ratio:16/9;overflow:hidden;background:#071018;box-shadow:0 12px 75px #0008}.stage img{width:100%;height:100%;object-fit:contain;display:block;animation:arrive .55s cubic-bezier(.2,.7,.2,1)}@keyframes arrive{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}button{font:600 14px DM,Arial;color:#edf2f4;background:#12202a;border:1px solid #526773;border-radius:4px;padding:12px 20px;cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:4px}#count{font-size:13px;min-width:52px;text-align:center;color:#b7cad4}.progress{height:2px;background:#243743;margin-top:16px}.progress span{height:100%;display:block;background:#d1dce1;transition:width .35s ease}footer{font-size:12px;color:#aebfc9;flex-wrap:wrap}footer a{margin-right:18px}.meta{font-size:12px;color:#afc0c9;margin:0}nav{justify-content:center}h1{font-size:15px;font-weight:600;margin:0}@media(max-width:700px){main{padding:18px 12px;gap:10px}header{align-items:flex-start}header strong{font-size:20px}header a{font-size:11px}.meta{font-size:10px}footer{line-height:1.8}button{padding:11px 16px}.stage{align-self:center}}@media(prefers-reduced-motion:reduce){.stage img{animation:none}.progress span{transition:none}}
</style></head><body><main><header><div><strong>NightLens</strong><h1>Seven-slide judge demo</h1></div><a href="../#observatory" target="_blank" rel="noopener">Open the actual app ↗</a></header><section aria-label="Presentation" class="stage" tabindex="0"><img id="slide" src="slides/slide-1.png" alt="NightLens: a real NASA investigation, a calculated sky, responsible lighting choices."></section><section><nav aria-label="Slide controls"><button id="prev" disabled aria-label="Previous slide">← Previous</button><output id="count" aria-live="polite">1 / 7</output><button id="next" aria-label="Next slide">Next →</button><button id="full" aria-label="Present fullscreen">Present</button></nav><div class="progress" aria-hidden="true"><span id="bar" style="width:14.2857%"></span></div><footer><p><a href="NightLens-seven-slide-demo.pdf">Download seven-slide PDF</a><a href="NightLens-judge-brief.pdf">Separate judge brief</a><a href="https://github.com/ethanplayer1211-spec/nightlens">Source repository ↗</a></p><p class="meta">Actual app captures · Codex-assisted presentation · ← / → to navigate</p></footer></section></main><script>
const titles=["Where did my stars go? The creator’s reason for building NightLens.", "First, ask the data. NASA MODIS Terra through Giovanni, 2001–2024.", "The endpoints fell. The fitted aerosol trend remains uncertain, p about 0.197.", "Light and haze can hide faint stars. An illustrative contrast comparison.", "So I made a place to notice the sky. Actual NightLens features.", "Small actions. Honest expectations. The observed Tucson lighting study.", "Your route through NightLens. Public app, NASA evidence, city experiment and code."];let i=0,image=document.getElementById('slide');const prev=document.getElementById('prev'),next=document.getElementById('next');function show(n){i=Math.max(0,Math.min(6,n));const fresh=image.cloneNode();fresh.src=`slides/slide-${i+1}.png`;fresh.alt=titles[i];image.replaceWith(fresh);image=fresh;document.getElementById('count').textContent=`${i+1} / 7`;document.getElementById('bar').style.width=`${(i+1)/7*100}%`;prev.disabled=i===0;next.disabled=i===6;history.replaceState(null,'',`#slide-${i+1}`)}prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(i+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(i-1)}if(e.key==='Home')show(0);if(e.key==='End')show(6)});document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{document.getElementById('full').textContent='Use browser fullscreen'}};let x;document.querySelector('.stage').addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});document.querySelector('.stage').addEventListener('touchend',e=>{if(Math.abs(e.changedTouches[0].clientX-x)>50)show(i+(e.changedTouches[0].clientX<x?1:-1))},{passive:true});const start=/slide-([1-7])/.exec(location.hash);if(start)show(+start[1]-1);for(let j=2;j<=7;j++){const preload=new Image();preload.src=`slides/slide-${j}.png`}
</script></body></html>
